<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小游戏产物 · 有原生 DOM 的宿主实测</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #14141a;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <!--
      这一页是 worker.js 的**对照组**，两个宿主缺一不可：

        worker.js  → 无 DOM（≈ 真机小游戏）
        本页       → 有原生 DOM（≈ 微信开发者工具的模拟器 / 任何浏览器）

      为什么必须两个都测：这两边的**代码路径不同**，而差异恰恰只在一边暴露。
      实测踩到的那次是这样的 —— `document` / `navigator` 在 `window` 上是
      `[LegacyUnforgeable]` 的只读属性，产物 IIFE 顶部又是 `"use strict"`，
      于是 `g.navigator = {...}` 直接抛 TypeError；它排在 `installGlobals()` 第一位，
      一抛就把后面的 document 垫片、rAF 兜底、以及紧随其后的「抢上屏画布」全部带走
      —— **纯黑屏，且窗口里一条报错都没有**。而这在 Worker 宿主里永远不会发生
      （那边本来就没有 document 可覆盖）。

      wx 桩写在这一页里而不是 worker.js 里，因为两者的取用方式根本不同：
      IDE 模拟器里 `wx.createCanvas()` 给的是**已经挂到页面上、玩家真的看得见**的
      真 canvas，而 Worker 里给的是 OffscreenCanvas。桩要如实反映这一点
      —— 不在文档流里的 canvas，`isConnected` 和 `getBoundingClientRect()` 都是废的，
      那样测出来的坐标映射是假的。
    -->
    <script src="/wx-stub.js"></script>
    <!--
      ★ 重现微信开发者工具模拟器的一个关键条件：**基准 URL 不能用来解析相对地址**。

      为什么必须在这一页重现它：这一页是「有原生 DOM」的宿主，而 IDE 模拟器也属于
      这一类 —— 产物在那一侧的代码路径与 Worker 侧完全不同（`installDocument()` 会
      **让路**，用宿主那份 document）。所以在这一页只验证「能启动」是不够的：
      真 Chromium 的 `document.baseURI` 是 `http://127.0.0.1:PORT/…`，**能**当基准，
      于是「宿主那份 baseURI 不能当基准」这条路径在本页**永远不会被走到** ——
      实测代价：`Failed to construct 'URL': Invalid URL` 在 IDE 里连报两轮，本地全绿。

      `about:blank` 是刻意的取值：它是非层级 URL，`new URL('x', 'about:blank')`
      在 Chromium 里必抛（本页下面那句自检会当场证明它真的抛，见 `__hostBaseUriUnusable`）
      —— 那个「必抛」正是探针，没有它这条重现就是空转。

      ⚠️ 为什么是改 `Node.prototype.baseURI` 的 getter，而不是别的做法：
        HTML 解析器解析相对 URL 用的是**内部**的 document base URL，不走这个 getter，
        所以「改 getter」只影响**产物脚本读到的那个值** —— 正是我们要重现的那一面，
        页面自己的资源加载（`<script src="/…">`）不受影响。
    -->
    <script>
      (function () {
        window.__hostBaseUriKind = 'unset';
        try {
          Object.defineProperty(Node.prototype, 'baseURI', {
            configurable: true,
            get: function () {
              return 'about:blank';
            }
          });
          window.__hostBaseUriKind = 'about:blank';
        } catch (e) {
          window.__hostBaseUriKind = 'override-failed: ' + (e && e.message);
        }
        window.__hostBaseUri = (function () {
          try {
            return String(document.baseURI);
          } catch (e) {
            return '#throw: ' + (e && e.message);
          }
        })();
        // 探针：这个基准**真的**不能用来解析相对地址吗？
        // 没有这一句，「宿主基准不可用」就只是我们的一句话，而不是一个被验证过的事实。
        window.__hostBaseUriUnusable = (function () {
          try {
            new URL('probe/child.js', window.__hostBaseUri);
            return false;
          } catch (e) {
            return true;
          }
        })();
      })();
    </script>
    <!--
      源码表 + CommonJS 装载器 —— 产物是「入口 + 它 require 的 chunk」两个文件，
      不能再用一个 `<script src="/game.js">` 装。

      为什么不顺着用 `<script src="/boot.js">` 再 `<script src="/game.js">`：
      那只有**一个全局作用域**，产物里 PRELUDE 的 `var document` 会变成真的全局
      `window.document`。而这一页的前提恰恰是「宿主本来没有 document」——
      那等于自己把被测条件破坏掉。装载器用模块包装函数把每个文件的 var 关进去，
      这也正是小游戏真实语义（官方「模块化」：一个 js 文件的变量只在该文件有效）。

      完整理由见 tools/minigame-harness/cjs-loader.js 文件头。
    -->
    <script src="/__sources.js"></script>
    <script src="/__data.js"></script>
    <script src="/cjs-loader.js"></script>
    <!--
      禁 unsafe-eval —— 与 Worker 宿主（worker.js 里的 importScripts）**共用同一份实现**。

      为什么有 DOM 的宿主也必须禁：浏览器（包括请 playwright 起的 chromium）默认允许 eval，
      Pixi 的 `unsafeEvalSupported()` 于是返回 true —— 也就是说在允许 eval 的宿主里，
      「漏了 `pixi.js/unsafe-eval`」这个 bug **永远不会暴露**：测试全绿，实际什么都没测到。
      装上禁令，「有 DOM / 无 DOM」两条路径才都真的覆盖它。

      ⚠️ 顺序：必须在**装载产物之前**。Pixi 的探测结果会被记忆化，
        第一次探测就发生在渲染器构造时。

      ⚠️ 它换的是 `globalThis.Function`，**不动 `eval`** —— 装载器用的正是直接 eval，
        两者刻意错开，免得装载器跟被测环境打架。
    -->
    <script src="/no-unsafe-eval.js"></script>
    <!-- 装上的**当刻**先自查一次并存证：驱动脚本启动后再查一次，两次对比才说明
         「禁令是在装载产物之前装上的，而且启动过程没把它换掉」。 -->
    <script>
      window.__evalBannedAtStart = window.__unsafeEvalBan.armed();
    </script>
    <script>
      // 装载产物。`/game.js` 内部会 `require('./boot.js')`，两个文件都要在源码表里。
      window.__motaLoadCjs('/game.js');
      window.__domHostReady = true;
    </script>
  </body>
</html>
